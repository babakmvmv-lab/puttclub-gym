name: HTTPS status for gym.puttclub.ir

on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch: {}

# Read-only monitor. The built-in GITHUB_TOKEN is not used to change Pages settings.
permissions:
  pages: read

jobs:
  cert:
    runs-on: ubuntu-latest
    steps:
      - name: Check certificate status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          H=(-H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json")
          R=$(curl --fail-with-body -sS "${H[@]}" "$API")
          echo "$R" | jq '{cname, https_enforced, https_certificate, protected_domain_state}'
          STATE=$(echo "$R" | jq -r '.https_certificate.state // "none"')
          ENF=$(echo "$R" | jq -r '.https_enforced')
          case "$STATE" in
            approved|issued)
              if [ "$ENF" = "true" ]; then
                echo "Certificate is ready and HTTPS enforcement is enabled."
              else
                echo "::error::Certificate is ready, but HTTPS enforcement is off; an authorized repository administrator must enable it after live TLS verification."
                exit 1
              fi
              ;;
            *)
              echo "::error::Certificate is not ready (state: $STATE). No settings were changed; an authorized repository administrator must restart provisioning if it remains stuck."
              exit 1
              ;;
          esac
